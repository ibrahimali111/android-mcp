[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server enabling AI agents (Claude, Cursor, LLMs) to control, inspect, and automate Android devices and Waydroid via ADB."
readme = "README.md"
authors = [{ name = "ibrahimali111" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["mcp", "mcp-server", "model-context-protocol", "android", "adb", "automation", "ai-agents", "claude-desktop", "waydroid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
android-mcp = "android_mcp.server:run_stdio_server"
